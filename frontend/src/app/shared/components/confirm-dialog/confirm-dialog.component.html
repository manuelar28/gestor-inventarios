<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p class="confirm-dialog__mensaje">{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true" cdkFocusInitial>{{ textoConfirmar }}</button>
</mat-dialog-actions>
